# Yerel gelistirme: docker compose up --build  (docs/DEPLOYMENT.md bolum 5)
# Frontend Docker disinda calisir (cd frontend && npm run dev): Windows/macOS bind mount'larinda
# Turbopack dosya degisikliklerini alamiyor, hot reload calismiyor (Next.js local-development rehberi).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusflow}
      POSTGRES_DB: ${POSTGRES_DB:-campusflow}
    ports:
      # Host portu 5433: bilgisayarda kurulu bir PostgreSQL (5432) ile cakismasin.
      # Backend DB'ye Docker agindan (db:5432) baglanir; bu port yalniz pgAdmin/DBeaver icin.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
